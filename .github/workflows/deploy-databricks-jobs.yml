name: Deploy Databricks Jobs

on:
  push:
    branches: [main]
    paths:
      - "databricks/jobs/**"
      - "scripts/deploy_databricks_jobs.py"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Deploy job configs to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLUSTER_POLICY_ID: ${{ secrets.DATABRICKS_CLUSTER_POLICY_ID }}
          DATABRICKS_STORAGE_ACCOUNT: ${{ secrets.DATABRICKS_STORAGE_ACCOUNT }}
        run: python scripts/deploy_databricks_jobs.py
